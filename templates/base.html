{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Evaluación Sumativa 2{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet"
          href="{% static 'css/estilos.css' %}">

</head>


<body>

    <!-- Barra de navegación -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               href="{% url 'inicio:inicio' %}">
                🏠 Evaluación Sumativa 2
            </a>


            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link"
                           href="{% url 'inicio:inicio' %}">
                            Inicio
                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="{% url 'inicio:gatos' %}">
                            🐱 Gatos
                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="{% url 'inicio:baloncesto' %}">
                            🏀 Baloncesto
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Contenido -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript propio -->

    <script src="{% static 'js/script.js' %}"></script>

</body>

</html>
